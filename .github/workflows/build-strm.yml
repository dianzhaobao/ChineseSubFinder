name: Build chinesesubfinder-strm

on:
  push:
    branches: [main, master]
    paths:
      - 'pkg/**'
      - 'internal/**'
      - 'cmd/**'
      - 'frontend/**'
      - 'Dockerfile.strm'
      - 'PATCHES.md'
      - '.github/workflows/build-strm.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          ls dist/spa

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libsqlite3-dev
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o chinesesubfinder ./cmd/chinesesubfinder
          ls -la chinesesubfinder
          file chinesesubfinder | head -1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.strm
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chinesesubfinder-strm:latest
            ghcr.io/${{ github.repository_owner }}/chinesesubfinder-strm:${{ github.sha }}
